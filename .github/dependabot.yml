version: 2

updates:
  # One grouped PR a week per ecosystem. Ungrouped updates on a repo this size
  # produce more review noise than they prevent.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Majors on these three are never a routine bump:
    #   astro      — a framework major is a deliberate, tested migration
    #   vite       — must stay on the major astro itself depends on, or the
    #                Plugin types conflict and `astro check` fails
    #   typescript — must satisfy @astrojs/check's peer range (^5 || ^6)
    ignore:
      - dependency-name: astro
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      dev-dependencies:
        dependency-type: development

  # Actions are pinned to commit SHAs in the workflows, so these updates are the
  # only thing that moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
